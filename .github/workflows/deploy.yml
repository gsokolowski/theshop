# CI on every PR / push to main. Deploy only on push to main (after CI passes).
# Secrets: SSH_PRIVATE_KEY, SSH_HOST, SSH_USER
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, tokenizer, xml, ctype, json, openssl, curl
          coverage: none
          tools: composer

      - name: Backend — env, Composer, PHPStan, tests
        working-directory: backend
        run: |
          cp -f .env.testing .env
          composer install --no-interaction --prefer-dist
          composer phpstan
          php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, lint, tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:run

  deploy:
    name: Deploy to droplet
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Use $GITHUB_ENV for host/user — more reliable than step outputs with secrets.
      - name: Setup SSH (key, known_hosts, deploy env)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 << 'PY'
          import os, pathlib
          key = os.environ["SSH_PRIVATE_KEY"].replace("\r\n", "\n").replace("\r", "\n")
          path = pathlib.Path.home() / ".ssh" / "deploy_key"
          path.write_text(key if key.endswith("\n") else key + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
          test -s ~/.ssh/deploy_key

          host=$(echo "$SSH_HOST" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          user=$(echo "$SSH_USER" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$host" ] || [ -z "$user" ]; then
            echo "::error::SSH_HOST or SSH_USER is empty after trim — check repository secrets."
            exit 1
          fi

          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "SSH_DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "SSH_DEPLOY_USER=$user" >> "$GITHUB_ENV"

      - name: Verify SSH connection
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}" \
            "echo SSH_OK"

      - name: Deploy backend
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}" \
            'bash /var/www/the-shop/repo/scripts/deploy-backend.sh'

      - name: Deploy frontend
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}" \
            'bash /var/www/the-shop/repo/scripts/deploy-frontend.sh'
