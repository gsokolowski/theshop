# CI on every PR / push to main. Deploy only on push to main (after CI passes).
# Secrets: SSH_PRIVATE_KEY, SSH_HOST, SSH_USER
# 
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, tokenizer, xml, ctype, json, openssl, curl
          coverage: none
          tools: composer

      - name: Backend — env, Composer, PHPStan, tests
        working-directory: backend
        run: |
          cp -f .env.testing .env
          composer install --no-interaction --prefer-dist
          composer phpstan
          php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, lint, tests, production build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:run
          npm run build

      # Deploy job rsyncs this folder to the droplet (no npm/vite on the server).
      - name: Upload frontend dist (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  deploy:
    name: Deploy to droplet
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Backend SSH + rsync of prebuilt dist (no npm on droplet).
    timeout-minutes: 30

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      # Secrets are never printed in logs (masked). This step only confirms they exist.
      - name: Require SSH secrets (repository Actions secrets)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          missing=0
          if [ -z "$SSH_PRIVATE_KEY" ]; then echo "::error::SSH_PRIVATE_KEY is missing. Add it under Settings → Secrets and variables → Actions → Repository secrets."; missing=1; fi
          if [ -z "$SSH_HOST" ]; then echo "::error::SSH_HOST is missing. Same place — name must be exactly SSH_HOST."; missing=1; fi
          if [ -z "$SSH_USER" ]; then echo "::error::SSH_USER is missing. Same place — name must be exactly SSH_USER."; missing=1; fi
          exit "$missing"

      # Use $GITHUB_ENV for host/user — more reliable than step outputs with secrets.
      - name: Setup SSH (key, known_hosts, deploy env)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python3 << 'PY'
          import os, pathlib
          key = os.environ["SSH_PRIVATE_KEY"].replace("\r\n", "\n").replace("\r", "\n")
          path = pathlib.Path.home() / ".ssh" / "deploy_key"
          path.write_text(key if key.endswith("\n") else key + "\n", encoding="utf-8")
          path.chmod(0o600)
          PY
          test -s ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is not a valid private key (ssh-keygen could not read it). Paste the full key, including -----BEGIN ...----- and -----END ...----- lines."
            exit 1
          fi

          host=$(echo "$SSH_HOST" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          user=$(echo "$SSH_USER" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$host" ] || [ -z "$user" ]; then
            echo "::error::SSH_HOST or SSH_USER is empty after trim — check repository secrets."
            exit 1
          fi

          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "SSH_DEPLOY_HOST=$host" >> "$GITHUB_ENV"
          echo "SSH_DEPLOY_USER=$user" >> "$GITHUB_ENV"

      - name: Verify SSH connection
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}" \
            "echo SSH_OK"

      # Do NOT use bash -l here: a login shell runs ~/.profile / .bashrc on the server; a bad line
      # there exits 255 before deploy scripts run. Scripts set PATH themselves (deploy-backend / -frontend).
      - name: Remote preflight (user, paths, tools)
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}" \
            'set -e; echo "== remote user=$(whoami) host=$(hostname) =="; \
             test -f /var/www/the-shop/repo/scripts/deploy-backend.sh; \
             command -v git; command -v rsync; command -v bash; \
             command -v php8.4 || command -v php; \
             test -x /usr/local/bin/composer || command -v composer; \
             echo PREFLIGHT_OK'

      - name: Deploy backend
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}" \
            "bash /var/www/the-shop/repo/scripts/deploy-backend.sh"

      # Built in CI (Vite); droplet only receives static files. Requires same VITE_* as .env.production in repo
      # (or add a CI step that writes .env.production.local from secrets before npm run build).
      - name: Publish frontend (rsync dist → droplet)
        run: |
          set -euo pipefail
          test -d frontend-dist
          RSYNC_RSH="ssh -i ${HOME}/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=30"
          export RSYNC_RSH
          rsync -az --delete \
            frontend-dist/ \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}:/var/www/the-shop/frontend/"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            -o BatchMode=yes \
            "${SSH_DEPLOY_USER}@${SSH_DEPLOY_HOST}" \
            "chown -R www-data:www-data /var/www/the-shop/frontend"
