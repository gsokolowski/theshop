# CI on every PR / push to main. Deploy only on push to main (after CI passes).
# Secrets: SSH_PRIVATE_KEY, SSH_HOST, SSH_USER
# In test
name: CI and deploy

env:
  # Use Node 24 for JS-based actions (checkout, etc.); see GitHub Actions changelog 2025-09.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, tokenizer, xml, ctype, json, openssl, curl
          coverage: none
          tools: composer

      - name: Backend — env, Composer, PHPStan, tests
        working-directory: backend
        run: |
          cp -f .env.testing .env
          composer install --no-interaction --prefer-dist
          composer phpstan
          php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, lint, tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:run

  deploy:
    name: Deploy to droplet
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy scripts on server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" \
            'bash /var/www/the-shop/repo/scripts/deploy-backend.sh && bash /var/www/the-shop/repo/scripts/deploy-frontend.sh'
