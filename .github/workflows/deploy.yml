# CI on every PR / push to main. Deploy only on push to main (after CI passes).
# Secrets: SSH_PRIVATE_KEY, SSH_HOST, SSH_USER
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, tokenizer, xml, ctype, json, openssl, curl
          coverage: none
          tools: composer

      - name: Backend — env, Composer, PHPStan, tests
        working-directory: backend
        run: |
          cp -f .env.testing .env
          composer install --no-interaction --prefer-dist
          composer phpstan
          php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install, lint, tests
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:run

  deploy:
    name: Deploy to droplet
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Write key to a file + ssh -i (avoids webfactory/ssh-agent Node 20 + ssh-add libcrypto issues with CRLF/malformed secrets).
      - name: Configure SSH and deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            'bash /var/www/the-shop/repo/scripts/deploy-backend.sh && bash /var/www/the-shop/repo/scripts/deploy-frontend.sh'
