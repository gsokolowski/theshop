; Laravel queue worker for The Shop (database driver).
; One-time on the server:
;   sudo cp /var/www/the-shop/repo/backend/deploy/supervisor-queue.conf /etc/supervisor/conf.d/the-shop-queue.conf
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start 'the-shop-queue:*'
;
; If PHP is only available as php8.4, change the command prefix to /usr/bin/php8.4 (or output of: command -v php8.4)

[program:the-shop-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/the-shop/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/the-shop/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/the-shop/backend/storage/logs/queue-worker.log
stopwaitsecs=3600
