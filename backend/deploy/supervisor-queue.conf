; Laravel Horizon for The Shop (Redis queues).
; Prerequisite: Supervisor + Redis + php-redis. e.g. Ubuntu:
;   sudo apt update && sudo apt install -y supervisor redis-server php8.4-redis
; One-time on the server (replace any previous the-shop-queue worker):
;   sudo cp /var/www/the-shop/repo/backend/deploy/supervisor-queue.conf /etc/supervisor/conf.d/the-shop-horizon.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl stop 'the-shop-queue:*' 2>/dev/null || true
;   sudo supervisorctl start the-shop-horizon
; .env must have QUEUE_CONNECTION=redis (and REDIS_*). Drain DB jobs first if switching from database:
;   php artisan queue:work database --stop-when-empty
; On deploy, pick up new code:
;   php artisan horizon:terminate
; (Supervisor restarts Horizon when autorestart=true.)
;
; If PHP is only available as php8.4, change the command prefix to /usr/bin/php8.4 (or output of: command -v php8.4)

[program:the-shop-horizon]
process_name=%(program_name)s
command=/usr/bin/php /var/www/the-shop/backend/artisan horizon
directory=/var/www/the-shop/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/the-shop/backend/storage/logs/horizon.log
stopwaitsecs=3600
