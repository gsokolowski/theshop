# Local Sail gateway: same path layout as production (nginx-site.example.conf).
# Host: shop-local.codecreators.co.uk  →  / = Vue (Vite), /api|/admin|/horizon|/storage|/up = Laravel

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream laravel {
    server laravel.test:80;
}

# Default: Vite on the host (npm run dev in frontend/). With profile docker-frontend, also
# start the frontend container and change this to: server frontend:5173;
upstream vite {
    server host.docker.internal:5173;
}

server {
    listen 80;
    listen 443 ssl;
    server_name shop-local.codecreators.co.uk;

    ssl_certificate     /etc/nginx/certs/shop-local.codecreators.co.uk.pem;
    ssl_certificate_key /etc/nginx/certs/shop-local.codecreators.co.uk-key.pem;

    client_max_body_size 64M;

    # Laravel JSON API
    location ^~ /api {
        proxy_pass http://laravel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Google OAuth Location headers can be large
        proxy_buffer_size 128k;
        proxy_buffers 256 16k;
        proxy_busy_buffers_size 256k;
    }

    # Blade admin
    location ^~ /admin {
        proxy_pass http://laravel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 256 16k;
        proxy_busy_buffers_size 256k;
    }

    # Horizon dashboard
    location ^~ /horizon {
        proxy_pass http://laravel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 128k;
        proxy_buffers 256 16k;
        proxy_busy_buffers_size 256k;
    }

    # Health check
    location = /up {
        proxy_pass http://laravel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Uploaded files (Laravel public/storage symlink)
    location ^~ /storage {
        proxy_pass http://laravel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
        expires 7d;
    }

    # Vue SPA + Vite HMR (WebSocket)
    location / {
        proxy_pass http://vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
