# Reference: Nginx for Vue SPA + Laravel API + Blade /admin (matches production droplet layout).
# Live config: /etc/nginx/sites-available/the-shop — NOT modified by deploy-backend.sh (only backend/ rsync).
#
# Paths: frontend static root = /var/www/the-shop/frontend ; Laravel = /var/www/the-shop/backend/public/index.php

server {
    server_name the-shop.codecreators.co.uk;

    root /var/www/the-shop/frontend;
    index index.html;

    client_max_body_size 64M;

    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/the-shop/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/the-shop/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        # Google OAuth callback: redirect Location includes token + base64 user JSON — exceeds default buffers → 502.
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ^~ /admin {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/the-shop/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/the-shop/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location ^~ /horizon {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/the-shop/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/the-shop/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/the-shop/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/the-shop/backend/public;
        fastcgi_param REQUEST_URI /up;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Uploaded files (profile images, etc.): Laravel stores under storage/app/public; public/storage
    # is the symlink. Without this block, /storage/* is resolved under `root` (the Vue folder) → 404.
    location ^~ /storage {
        root /var/www/the-shop/backend/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSL listen + certbot lines go here on the server
}
