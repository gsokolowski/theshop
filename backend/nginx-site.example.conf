# Example: Nginx for Vue SPA + Laravel API + Blade /admin
# Copy/adapt on the droplet — paths and PHP socket must match your server.
#
# Problem this fixes: if `location /` only does `try_files ... /index.html`, then
# /admin, /api, and /up never hit Laravel and you only see the SPA placeholder.

# SPA static root (built frontend)
# root /var/www/the-shop/frontend/dist;

# Laravel public (must match deploy)
# set $laravel_root /var/www/the-shop/backend/public;
# set $laravel_index $laravel_root/index.php;

