# Laravel Sail + custom nginx gateway for the-shop monorepo.
# Public entry: nginx → shop-local.codecreators.co.uk (/ = Vue on host Vite, /api|/admin|/horizon|/storage|/up = Laravel)
#
# Vue runs on the host (npm run dev in frontend/) because this repo often lives under
# /Applications/... which Docker Desktop may not file-share. Optional profile `docker-frontend`
# runs Vite in Compose when the project path is shared (see docs/SAIL.md).
services:
    nginx:
        image: 'nginx:alpine'
        ports:
            - '${APP_PORT:-80}:80'
            - '${FORWARD_HTTPS_PORT:-443}:443'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
            - './docker/nginx/certs:/etc/nginx/certs:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailpit
    horizon:
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - redis
        command: php artisan horizon
    # Optional: ./vendor/bin/sail --profile docker-frontend up -d
    # Requires Docker Desktop → Preferences → Resources → File Sharing to include this repo path.
    frontend:
        profiles: ['docker-frontend']
        image: 'node:22-alpine'
        working_dir: /var/www/frontend
        environment:
            VITE_API_BASE_URL: '${VITE_API_BASE_URL:-https://shop-local.codecreators.co.uk/api/v1}'
            VITE_HMR_HOST: shop-local.codecreators.co.uk
            VITE_HMR_PROTOCOL: wss
            VITE_HMR_CLIENT_PORT: '443'
        volumes:
            - '../frontend:/var/www/frontend'
            - 'sail-frontend-node-modules:/var/www/frontend/node_modules'
        networks:
            - sail
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
        expose:
            - '5173'
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-33060}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            # Avoid clashing with a host/standalone Redis on 6379
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-frontend-node-modules:
        driver: local
